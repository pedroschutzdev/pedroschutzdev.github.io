<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demonstração · Pedro Schütz</title>
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:#fff;overflow:hidden;display:flex;flex-direction:column;
  background:radial-gradient(900px 700px at 85% 0%,#1B3A9A 0%,transparent 60%),radial-gradient(800px 600px at 0% 100%,#0A2468 0%,transparent 60%),#021442}
a{color:inherit;text-decoration:none}
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:rgba(2,20,66,.85);border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.back{font-size:14px;font-weight:600;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:6px;white-space:nowrap}
.back:hover{color:#fff}
.title{font-size:14px;font-weight:600;color:rgba(255,255,255,.6)}
.toggle{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:4px;gap:2px}
.toggle button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:rgba(255,255,255,.7)}
.toggle button svg{width:16px;height:16px}
.toggle button[aria-pressed="true"]{background:#fff;color:#021442}
.cta{background:#1f9d55;color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;white-space:nowrap}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
.dev{position:absolute;left:50%;top:50%;transform-origin:center center}
.dev iframe{display:block;border:0;background:#fff;width:100%;height:100%}
/* celular */
.dev.phone{width:390px;height:844px;border-radius:52px;padding:12px;background:#0a0c11;box-shadow:0 40px 90px rgba(0,0,0,.55),inset 0 0 0 2px #23262d}
.dev.phone iframe{border-radius:40px}
.dev.phone:before{content:"";position:absolute;top:22px;left:50%;width:110px;height:30px;margin-left:-55px;background:#0a0c11;border-radius:20px;z-index:2}
/* computador */
.dev.desk{width:1440px;height:900px;border-radius:18px;padding:30px 14px 14px;background:#0a0c11;box-shadow:0 40px 90px rgba(0,0,0,.55)}
.dev.desk:before{content:"";position:absolute;top:11px;left:18px;width:10px;height:10px;border-radius:50%;background:#ff5f57;box-shadow:16px 0 #febc2e,32px 0 #28c840}
.dev.desk iframe{border-radius:6px}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;color:rgba(255,255,255,.55)}
@media (max-width:640px){.title{display:none}.bar{justify-content:center}.back{order:0}.toggle{order:1}.cta{order:2}}
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="index.html#demonstracoes">&larr; Voltar ao site</a>
  <span class="title" id="nome"></span>
  <div class="toggle" role="group" aria-label="Ver como">
    <button data-modo="computador"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Computador</button>
    <button data-modo="celular"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>Celular</button>
  </div>
  <a class="cta" href="index.html#contato">Quero um assim</a>
</div>
<div class="stage" id="stage">
  <div class="dev" id="dev"><iframe id="fr" title="Demonstração"></iframe></div>
  <div class="hint" id="hint"></div>
</div>
<script>
const DEMOS = {
  "estetica-odonto": "Estética e odontologia · Clínica Lumen",
  "fisioterapia": "Fisioterapia · Kinesis",
  "revenda": "Revenda de veículos · Pátio CRM"
};
const q = new URLSearchParams(location.search);
const demo = DEMOS[q.get("demo")] ? q.get("demo") : "estetica-odonto";
const ehCelular = matchMedia("(max-width:820px)").matches;
let modo = q.get("modo") || (ehCelular ? "computador" : "celular");
document.getElementById("nome").textContent = DEMOS[demo];
document.title = DEMOS[demo] + " · demonstração";
const fr = document.getElementById("fr"), dev = document.getElementById("dev"), stage = document.getElementById("stage"), hint = document.getElementById("hint");
fr.src = "demos/" + demo + ".html";

function fit() {
  const W = modo === "celular" ? 390 : 1440, H = modo === "celular" ? 844 : 900;
  const r = stage.getBoundingClientRect();
  const s = Math.min(1, (r.width - 24) / W, (r.height - 36) / H);
  dev.style.transform = `translate(-50%,-50%) scale(${s})`;
  hint.textContent = modo === "computador" && s < 0.5 && innerHeight > innerWidth ? "Dica: vire o celular de lado para ver maior." : "";
}
function aplicar(m) {
  modo = m;
  dev.className = "dev " + (m === "celular" ? "phone" : "desk");
  document.querySelectorAll("[data-modo]").forEach(b => b.setAttribute("aria-pressed", b.dataset.modo === m));
  try { history.replaceState(null, "", `?demo=${demo}&modo=${m}`); } catch (e) {}
  fit();
}
document.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => aplicar(b.dataset.modo));
addEventListener("resize", fit);
aplicar(modo);
</script>
</body>
</html>
