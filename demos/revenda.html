<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pátio CRM Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: painel de revenda — trilho lateral "asfalto" + área de trabalho clara; no celular o trilho vira barra inferior */
:root{
  --bg:#f3f3f0; --surface:#ffffff; --surface-2:#f7f7f4; --line:#e2e1db; --fg:#1d1f22; --muted:#6b6d70;
  --side:#1c1e21; --side-fg:#e4e4df; --side-muted:#8a8c8f; --side-active:#2b2e32;
  --accent:#e8a317; --accent-ink:#1c1e21; --accent-soft:#fbefd2;
  --good:#2f8f5b; --warn:#c77a12; --bad:#c43d3d; --info:#2f63b5; --violet:#7b5cc7;
  --tire:#1a1b1d; --rim:#c9ccd0; --glass:#2a3440;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121315; --surface:#1b1d20; --surface-2:#22252a; --line:#30333a; --fg:#ececea; --muted:#9a9c9f;
  --side:#0c0d0e; --side-fg:#e4e4df; --side-muted:#7c7e81; --side-active:#1f2124;
  --accent-soft:#3a2f17;
  --good:#5cc289; --warn:#e9a24a; --bad:#ec7575; --info:#7aa6ee; --violet:#a58ff0;
  --tire:#050506; --rim:#8e9399; --glass:#33404e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1b1d20; --surface-2:#22252a; --line:#30333a; --fg:#ececea; --muted:#9a9c9f;
  --side:#0c0d0e; --side-fg:#e4e4df; --side-muted:#7c7e81; --side-active:#1f2124;
  --accent-soft:#3a2f17;
  --good:#5cc289; --warn:#e9a24a; --bad:#ec7575; --info:#7aa6ee; --violet:#a58ff0;
  --tire:#050506; --rim:#8e9399; --glass:#33404e;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%;background:linear-gradient(to right,var(--side) 232px,transparent 232px)}
.side{background:var(--side);color:var(--side-fg);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;min-width:0}
.brand-mark{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:21px;flex:none}
.brand-name{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.03em;line-height:1.05;text-transform:uppercase;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.brand-sub{font-size:11px;color:var(--side-muted);text-transform:uppercase;letter-spacing:.12em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:7px;color:var(--side-muted);font-weight:500}
.nav button:hover{color:var(--side-fg)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav button[aria-current="page"]{background:var(--side-active);color:var(--side-fg);box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{width:19px;height:19px;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:0 8px}
.user{display:flex;align-items:center;gap:10px;font-size:13px}
.user b{display:block;color:var(--side-fg);font-weight:600}
.user span{color:var(--side-muted)}
.linkbtn{all:unset;cursor:pointer;color:var(--side-muted);font-size:13px}
.linkbtn:hover{color:var(--side-fg)}
.linkbtn:focus-visible{outline:2px solid var(--accent)}

.main{min-width:0;padding-block:24px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-size:34px;font-weight:700;margin:2px 0 0;line-height:1.05;text-wrap:balance}
h2{font-family:var(--f-display);font-size:20px;font-weight:600;margin:0;letter-spacing:.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.06);border-color:var(--accent)}
.btn-sm{padding:5px 10px;font-size:13px}
.btn-wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.btn-wa:hover{filter:brightness(1.07);border-color:#1f9d55}
.btn svg{width:16px;height:16px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 13px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel-head small{color:var(--muted);font-size:13px}
.kpi .label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.kpi .value{font-family:var(--f-display);font-size:36px;font-weight:700;line-height:1.1;margin-top:4px}
.kpi .delta{font-size:13px;color:var(--muted)}
.up{color:var(--good);font-weight:600}
.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}

/* Assistente IA */
.ai{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 7%,var(--surface)),var(--surface) 60%);margin-top:16px}
.ai-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ai-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:20px;font-weight:700}
.ai-badge svg{width:22px;height:22px;color:var(--accent)}
.ai-head small{color:var(--muted);font-size:13px}
.live{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 22%,transparent)}
.ai-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.insights{display:flex;flex-direction:column;gap:8px}
.insight{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px 10px 0;overflow:hidden}
.insight .stripe{align-self:stretch;margin:-10px 0}
.insight p{margin:0;font-size:14px}
.insight p b{font-weight:600}
.insight .kind{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;display:block;margin-bottom:1px}
.ask{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;text-align:left}
.qchips button:hover,.qchips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.answer{font-size:14px;min-height:84px;line-height:1.5}
.answer .who{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.answer .who svg{width:14px;height:14px;color:var(--accent)}
.caret{display:inline-block;width:7px;height:15px;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.funnel{display:flex;flex-direction:column;gap:9px}
.frow{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;align-items:center;gap:10px;font-size:14px}
.ftrack{height:24px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.fbar{height:100%;border-radius:5px;transition:width .4s ease}
.frow b{text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-direction:column;gap:8px;font-size:14px}
.legend div{display:flex;align-items:center;gap:10px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .lv{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr[data-lead]:hover td{background:var(--surface-2)}
.tscroll{overflow-x:auto}
.right{text-align:right}
.rank{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--surface-2);font-weight:600;font-size:13px}
.rank.r1{background:var(--accent);color:var(--accent-ink)}
.meter{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--accent)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;color:#fff;white-space:nowrap}
.plate{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;border:1.5px solid var(--fg);border-radius:4px;background:#fff;color:#111;overflow:hidden;line-height:1}
.plate i{display:block;width:100%;height:5px;background:#2f63b5}
.plate span{padding:2px 7px 3px}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:170px;max-width:320px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
.filterchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;font-weight:600}
.filterchip button{border:0;background:none;color:inherit;font-size:16px;line-height:1;padding:0 4px}
.hint{font-size:13px;color:var(--muted)}

.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:220px;scroll-snap-align:start}
.col.drop{outline:2px dashed var(--accent);outline-offset:-4px;background:var(--accent-soft)}
.col-head{display:flex;align-items:center;gap:8px;padding:2px 4px 6px;font-family:var(--f-display);font-size:16px;font-weight:600}
.col-head .dot{width:9px;height:9px;border-radius:50%}
.col-head .count{margin-left:auto;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;cursor:grab;text-align:left;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.card:hover{border-color:var(--muted)}
.card.dragging{opacity:.35}
.ghost{position:fixed;z-index:70;pointer-events:none;transform:rotate(2deg) scale(1.02);box-shadow:0 14px 34px rgba(0,0,0,.28);margin:0}
.card .name{font-weight:600}
.card .car{font-size:13px;color:var(--muted)}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.stale{color:var(--bad);font-weight:600}
.avatar{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}

.agenda{display:flex;flex-direction:column;gap:16px}
.day h3{font-family:var(--f-display);font-size:17px;margin:0 0 8px;font-weight:600}
.slot{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.slot + .slot{margin-top:6px}
.slot time{font-family:var(--f-display);font-size:20px;font-weight:600}
.slot .who{font-weight:600}
.slot .what{font-size:13px;color:var(--muted)}

.cars{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.carcard{display:flex;flex-direction:column;gap:10px}
.carimg{aspect-ratio:16/8;max-width:100%;border-radius:8px;background:radial-gradient(ellipse at 50% 85%,color-mix(in srgb,var(--fg) 6%,transparent),transparent 70%),var(--surface-2);display:grid;place-items:center;overflow:hidden}
.carimg svg{width:84%;height:auto}
.carcard h3{margin:0;font-family:var(--f-display);font-size:20px;font-weight:600}
.specs{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.price{font-family:var(--f-display);font-size:24px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}

.goal-big{font-family:var(--f-display);font-size:52px;font-weight:700;line-height:1}
.bar-goal{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden;margin:12px 0 6px;position:relative}
.bar-goal i{display:block;height:100%;background:var(--accent);border-radius:7px}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(450px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:41;overflow-y:auto;padding:calc(22px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) 22px;display:flex;flex-direction:column;gap:18px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 32px));max-height:calc(100% - 40px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;z-index:41;padding:22px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.field input,.field select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 11px;min-width:0}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.close{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);padding:0 4px}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tagpick button{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:3px 9px;font-size:12px;font-weight:600}
.tagpick button[aria-pressed="true"]{color:#fff;border-color:transparent}
.interest{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.interest svg{width:100%;height:auto}
.wa-box{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.tpl{display:flex;flex-wrap:wrap;gap:6px}
.tpl button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.tpl button[aria-pressed="true"]{border-color:#1f9d55;background:color-mix(in srgb,#1f9d55 14%,transparent)}
.bubble{background:color-mix(in srgb,#1f9d55 12%,var(--surface));border-radius:10px 10px 2px 10px;padding:10px 12px;font-size:14px;align-self:flex-end;max-width:92%;white-space:pre-line}
.timeline{display:flex;flex-direction:column;gap:10px;font-size:14px;border-left:2px solid var(--line);padding-left:14px}
.timeline small{display:block;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;z-index:90;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.err{color:var(--bad);font-size:13px}

/* Login / personalização */
.login{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);overflow-y:auto}
.login-art{background:var(--side);color:var(--side-fg);padding:calc(44px + env(safe-area-inset-top,0px)) 48px calc(44px + env(safe-area-inset-bottom,0px)) max(48px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:100%}
.login-art h2{font-size:42px;line-height:1.02;font-weight:700;text-wrap:balance;max-width:16ch}
.login-art .lead{color:var(--side-muted);font-size:16px;max-width:42ch;margin:12px 0 0}
.login-car{max-width:520px}
.login-car svg{width:100%;height:auto}
.feats{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--side-muted)}
.feats span{display:flex;align-items:center;gap:8px}
.feats i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.login-form{display:flex;align-items:center;justify-content:center;padding:calc(32px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) 24px}
.login-form form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.login-form h1{font-size:30px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:38px;height:38px;border-radius:9px;border:2px solid transparent;padding:0;display:grid;place-items:center}
.swatches button[aria-pressed="true"]{border-color:var(--fg)}
.swatches button span{width:26px;height:26px;border-radius:6px;display:block}
.preview-brand{display:flex;align-items:center;gap:10px;background:var(--side);color:var(--side-fg);border-radius:10px;padding:10px 12px}
.divider{height:1px;background:var(--line);margin:4px 0}
.fine{font-size:12px;color:var(--muted);text-align:center}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.ai-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.login{grid-template-columns:minmax(0,1fr);grid-auto-rows:max-content;align-content:start}.login-art{min-height:0;padding:calc(28px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 28px max(20px,env(safe-area-inset-left,0px));gap:18px}.login-art h2{font-size:32px}.login-car,.feats{display:none}.login-form{align-items:flex-start;padding-top:28px}}
@media (max-width:760px){

// ================= Cálculos (um único lugar, para tudo bater) =================
function stats(){
  const f=PERIODOS[periodo].f, sc=v=>Math.round(v*f);
  const vendidosCard=LEADS.filter(l=>l.etapa==="vendido").length;
  const rk=VEND.map(v=>{const atend=sc(BASE.atend[v.id])+LEADS.filter(l=>l.vend===v.id).length*(periodo==="mes"?1:0);const n=sc(BASE.vendas[v.id])+(periodo==="mes"?LEADS.filter(l=>l.vend===v.id&&l.etapa==="vendido").length:0);return{...v,atend:Math.max(atend,1),vend:n,conv:n/Math.max(atend,1)*100}}).sort((a,b)=>b.vend-a.vend||b.conv-a.conv);
  const vendidos=rk.reduce((a,r)=>a+r.vend,0);
  const leads=sc(BASE.leadsMes)+(periodo==="mes"?LEADS.length:0);
  const cnt=id=>periodo==="mes"?LEADS.filter(l=>l.etapa===id).length:0;
  const funil=[{n:"Leads recebidos",v:leads,c:"var(--info)"},{n:"Qualificados",v:sc(BASE.qualif)+cnt("qualificado"),c:"var(--violet)"},{n:"Visitaram a loja",v:sc(BASE.visita)+cnt("visita"),c:"var(--warn)"},{n:"Negociação",v:sc(BASE.negoc)+cnt("negociacao"),c:"var(--accent)"},{n:"Vendidos",v:vendidos,c:"var(--good)"}];
  const orig=ORIGENS.map(o=>({...o,v:sc(o.base)+(periodo==="mes"?LEADS.filter(l=>l.origem===o.nome).length:0)}));
  const vendMes=BASE.vendas.ana+BASE.vendas.bruno+BASE.vendas.diego+vendidosCard;
  return{leads,vendidos,conv:vendidos/Math.max(leads,1)*100,fat:vendidos*TICKET,rk,funil,orig,vendMes,ritmo:vendMes/29*31};
}

// ================= Assistente IA =================
function insights(){
  const s=stats();
  const parados=LEADS.filter(l=>ativo(l)&&l.dias>=3);
  const maior=LEADS.filter(l=>l.etapa==="negociacao").sort((a,b)=>b.valor-a.valor)[0];
  const novosSem=LEADS.filter(l=>l.etapa==="novo"&&!l.vend);
  const consigVelho=CONSIG.slice().sort((a,b)=>b.dias-a.dias)[0];
  const out=[];
  if(parados.length)out.push({k:"Urgente",c:"var(--bad)",t:`<b>${parados.length} leads parados há 3 dias ou mais.</b> Quem não recebe retorno em 72h costuma comprar em outra loja.`,a:"Ver leads",fn:()=>{soParados=true;leadMode="lista";go("leads")}});
  if(novosSem.length)out.push({k:"Atenção",c:"var(--warn)",t:`<b>${novosSem.length} leads novos sem vendedor.</b> ${novosSem.map(l=>l.nome.split(" ")[0]).join(", ")} chegaram e ainda não foram atendidos.`,a:"Distribuir",fn:()=>{novosSem.forEach((l,i)=>l.vend=VEND[i%VEND.length].id);toast(`${novosSem.length} leads distribuídos no rodízio`);render(false)}});
  if(maior)out.push({k:"Oportunidade",c:"var(--accent)",t:`<b>${esc(maior.nome)}</b> negocia a ${esc(maior.carro.split(" ").slice(0,2).join(" "))} (${brl(maior.valor)}), o maior ticket do funil, há ${maior.dias} dias.`,a:"Abrir lead",fn:()=>openLead(maior.id)});
  out.push({k:"Estoque",c:"var(--info)",t:`<b>${esc(consigVelho.modelo.split(" ").slice(0,2).join(" "))}</b> está há ${consigVelho.dias} dias no pátio. Baixar para ${brl(Math.round(consigVelho.fipe*.945/100)*100)} deixa o preço 5,5% abaixo da FIPE.`,a:"Ver carro",fn:()=>go("consig")});
  out.push({k:"Meta",c:s.ritmo>=META?"var(--good)":"var(--warn)",t:`No ritmo atual, outubro fecha com <b>${Math.round(s.ritmo)} vendas</b> ${s.ritmo>=META?"e a meta de "+META+" é batida.":"e faltariam "+(META-Math.round(s.ritmo))+" para a meta."}`,a:"Ver metas",fn:()=>go("metas")});
  return out.slice(0,4);
}

    ${s.rk.map(r=>`<tr><td><div style="display:flex;align-items:center;gap:8px;white-space:nowrap">${av(r.id)}${r.nome}</div></td><td>Vendedor</td><td class="right num">${r.vend}</td><td class="right num hide-sm">${brl(COMISSAO_VEND)}</td><td class="right num"><b>${brl(r.vend*COMISSAO_VEND)}</b></td></tr>`).join("")}
    <tr><td><div style="display:flex;align-items:center;gap:8px;white-space:nowrap"><span class="avatar" style="background:var(--accent);color:var(--accent-ink)">PV</span>Pré-vendas</div></td><td>SDR</td><td class="right num">${sdr}</td><td class="right num hide-sm">${brl(COMISSAO_SDR)}</td><td class="right num"><b>${brl(sdr*COMISSAO_SDR)}</b></td></tr>
    </tbody></table></div>
  </div>`;
}

// ================= Ficha do lead =================
const MODELOS_WA=[
  {n:"Primeiro contato",t:l=>`Olá, ${l.nome.split(" ")[0]}! Aqui é da ${brand.nome}. Vi seu interesse no ${l.carro.split(" ").slice(0,3).join(" ")}. Ele ainda está disponível. Quer agendar uma visita ou um test-drive?`},
  {n:"Follow-up",t:l=>`Oi, ${l.nome.split(" ")[0]}, tudo bem? Passando para saber se ficou alguma dúvida sobre o ${l.carro.split(" ").slice(0,2).join(" ")}. Consigo segurar a condição que conversamos até sábado.`},
  {n:"Simulação",t:l=>`${l.nome.split(" ")[0]}, fiz a simulação do ${l.carro.split(" ").slice(0,2).join(" ")} com entrada de 30%: parcelas a partir de ${brl(Math.round(l.valor*.7/48*1.35/10)*10)} em 48x. Posso te mandar os detalhes?`}
];
function openLead(id){
  const l=LEADS.find(x=>x.id===id);if(!l)return;
  let tpl=0;
  const draw=()=>{
    $("#layer").innerHTML=`<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Ficha de ${esc(l.nome)}">
      <div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div style="min-width:0"><div class="eyebrow">${esc(l.origem)} · ${etapa(l.etapa).nome}</div><h1 style="font-size:28px">${esc(l.nome)}</h1><div style="color:var(--muted)" class="num">${esc(l.tel)}</div></div><button class="close" id="x" aria-label="Fechar">×</button></div>
      <div class="interest"><div style="min-width:0"><div class="eyebrow">Interesse</div><div style="font-weight:600;margin-top:2px">${esc(l.carro)}</div><div class="num" style="font-family:var(--f-display);font-size:24px;font-weight:700">${brl(l.valor)}</div></div>${carSvg(tipoCarro(l.carro),l.cor||"#9aa0a6")}</div>
      <div class="wa-box">
        <div class="row"><span class="eyebrow">Mensagem rápida</span><div class="tpl">${MODELOS_WA.map((m,i)=>`<button data-tpl="${i}" aria-pressed="${i===tpl}">${m.n}</button>`).join("")}</div></div>
        <div class="bubble">${esc(MODELOS_WA[tpl].t(l))}</div>
        <div class="row"><button class="btn btn-wa" id="wa">${ICONS.wa}Enviar no WhatsApp</button><button class="btn btn-sm" id="copy">Copiar texto</button></div>
      </div>
      <div class="fields2">
        <div class="field"><label for="d-etapa">Etapa</label><select id="d-etapa">${ETAPAS.map(e=>`<option value="${e.id}" ${e.id===l.etapa?"selected":""}>${e.nome}</option>`).join("")}</select></div>
        <div class="field"><label for="d-vend">Vendedor</label><select id="d-vend"><option value="">Sem vendedor</option>${VEND.map(v=>`<option value="${v.id}" ${v.id===l.vend?"selected":""}>${v.nome}</option>`).join("")}</select></div>
      </div>
      <div class="field"><span class="lbl">Etiquetas</span><div class="tagpick">${TAGS.map(t=>{const on=l.tags.includes(t.id);return `<button data-tag="${t.id}" aria-pressed="${on}" style="${on?`background:${t.cor}`:""}">${esc(t.nome)}</button>`}).join("")}</div></div>
      <div class="field"><span class="lbl">Histórico</span><div class="timeline">
        <div>Lead entrou pelo ${esc(l.origem)}<small>há ${l.dias+2} dias · automático</small></div>
        <div>Pré-vendas qualificou: busca ${esc(l.carro.split(" ").slice(0,2).join(" "))}, ${l.tags.includes("t2")?"quer financiar":"pagamento a definir"}${l.tags.includes("t1")?", tem carro na troca":""}<small>há ${l.dias+1} dias · Pré-vendas</small></div>
        ${l.vend?`<div>Encaminhado para ${esc(vend(l.vend).nome)}<small>há ${l.dias} dias · rodízio automático</small></div>`:""}
        ${l.motivo?`<div style="color:var(--bad)">Perdido: ${esc(l.motivo)}</div>`:""}
      </div></div>
    </aside>`;
    $("#x").onclick=$("#scrim").onclick=closeLayer;
    $("#x").focus();
    $("#d-etapa").onchange=e=>{l.etapa=e.target.value;l.dias=0;toast(`Movido para ${etapa(l.etapa).nome}`);render(false);draw()};
    $("#d-vend").onchange=e=>{l.vend=e.target.value||null;toast(l.vend?`Atribuído a ${vend(l.vend).nome}`:"Vendedor removido");render(false)};
    document.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{const t=b.dataset.tag;l.tags=l.tags.includes(t)?l.tags.filter(x=>x!==t):[...l.tags,t];draw();render(false)});
    document.querySelectorAll("[data-tpl]").forEach(b=>b.onclick=()=>{tpl=+b.dataset.tpl;draw()});
    $("#wa").onclick=()=>toast("Na versão completa, a mensagem vai direto para o WhatsApp do cliente e fica salva no histórico.");
    $("#copy").onclick=()=>{const txt=MODELOS_WA[tpl].t(l);try{navigator.clipboard.writeText(txt).then(()=>toast("Texto copiado"),()=>selectBubble())}catch(e){selectBubble()}};
  };
  draw();
}
function selectBubble(){const b=document.querySelector(".bubble");if(!b)return;const r=document.createRange();r.selectNodeContents(b);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Texto selecionado. Copie com o atalho do seu aparelho.")}
function closeLayer(){$("#layer").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLayer()});

// ================= Novo lead =================
function openNovo(){
  $("#layer").innerHTML=`<div class="scrim" id="scrim"></div><form class="modal" id="f" role="dialog" aria-modal="true" aria-label="Novo lead" novalidate>
    <div class="row"><h2 style="font-size:24px">Novo lead</h2><button type="button" class="close" id="x" aria-label="Fechar">×</button></div>
    <div class="field"><label for="n-nome">Nome do cliente</label><input id="n-nome" autocomplete="off" placeholder="Ex.: João da Silva"></div>
    <div class="fields2">
      <div class="field"><label for="n-tel">WhatsApp</label><input id="n-tel" inputmode="tel" placeholder="(51) 9 0000-0000"></div>
      <div class="field"><label for="n-origem">Origem</label><select id="n-origem">${ORIGENS.map(o=>`<option>${o.nome}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label for="n-carro">Veículo de interesse</label><input id="n-carro" placeholder="Ex.: Onix LT 2022"></div>
    <div class="fields2">
      <div class="field"><label for="n-valor">Valor (R$)</label><input id="n-valor" inputmode="numeric" placeholder="85000"></div>
      <div class="field"><label for="n-vend">Vendedor</label><select id="n-vend"><option value="">Rodízio automático</option>${VEND.map(v=>`<option value="${v.id}">${v.nome}</option>`).join("")}</select></div>
    </div>
    <div class="err" id="n-err" hidden>Preencha o nome do cliente e o veículo de interesse.</div>
    <button class="btn btn-primary" type="submit" style="padding:11px 14px">Cadastrar lead</button>
  </form>`;
  $("#x").onclick=$("#scrim").onclick=closeLayer;
  $("#n-nome").focus();
  $("#f").onsubmit=e=>{
    e.preventDefault();
    const nome=$("#n-nome").value.trim(),carro=$("#n-carro").value.trim();
    if(!nome||!carro){$("#n-err").hidden=false;return}
    let v=$("#n-vend").value;
    if(!v){v=VEND.map(x=>({id:x.id,n:LEADS.filter(l=>l.vend===x.id&&ativo(l)).length})).sort((a,b)=>a.n-b.n)[0].id}
    LEADS.unshift({id:Date.now(),nome,tel:$("#n-tel").value.trim()||"(51) 9 0000-0000",carro,cor:"#9aa0a6",valor:parseInt($("#n-valor").value.replace(/\D/g,""))||0,origem:$("#n-origem").value,etapa:"novo",vend:v,dias:0,tags:[]});
    closeLayer();toast(`Lead cadastrado e enviado para ${vend(v).nome}`);
    if(view!=="geral")view="leads";render();
  };
}

// ================= Arrastar (mouse e toque) =================
function colAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest("[data-col]")}
function startDrag(card,x,y){
  const r=card.getBoundingClientRect();const g=card.cloneNode(true);
  g.classList.add("ghost");g.removeAttribute("data-lead");g.style.width=r.width+"px";g.style.left=r.left+"px";g.style.top=r.top+"px";
  document.body.appendChild(g);card.classList.add("dragging");
  dragState={id:+card.dataset.lead,card,g,dx:x-r.left,dy:y-r.top,over:null};
  try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
}
function moveDrag(x,y){
  const d=dragState;if(!d)return;d.g.style.left=(x-d.dx)+"px";d.g.style.top=(y-d.dy)+"px";
  const c=colAt(x,y);if(c!==d.over){d.over&&d.over.classList.remove("drop");c&&c.classList.add("drop");d.over=c}
  const k=document.querySelector(".kanban");if(k){const kr=k.getBoundingClientRect();if(x<kr.left+44)k.scrollLeft-=14;else if(x>kr.right-44)k.scrollLeft+=14}
}
function endDrag(x,y){
  const d=dragState;if(!d)return;dragState=null;d.g.remove();d.card.classList.remove("dragging");d.over&&d.over.classList.remove("drop");
  suppressClick=true;setTimeout(()=>suppressClick=false,80);
  const c=colAt(x,y);const l=LEADS.find(v=>v.id===d.id);
  if(c&&l&&l.etapa!==c.dataset.col){l.etapa=c.dataset.col;l.dias=0;toast(`${l.nome.split(" ")[0]} → ${etapa(l.etapa).nome}`)}
  render(false);
}
function bindDrag(card){
  card.addEventListener("mousedown",e=>{
    if(e.button!==0)return;const sx=e.clientX,sy=e.clientY;let started=false;
    const mm=ev=>{if(!started){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;started=true;startDrag(card,sx,sy)}ev.preventDefault();moveDrag(ev.clientX,ev.clientY)};
    const mu=ev=>{document.removeEventListener("mousemove",mm);document.removeEventListener("mouseup",mu);if(started)endDrag(ev.clientX,ev.clientY)};
    document.addEventListener("mousemove",mm);document.addEventListener("mouseup",mu);
  });
  card.addEventListener("touchstart",e=>{
    if(e.touches.length>1)return;const t=e.touches[0];const sx=t.clientX,sy=t.clientY;let lx=sx,ly=sy,started=false;
    const timer=setTimeout(()=>{started=true;startDrag(card,lx,ly)},280);
    const off=()=>{card.removeEventListener("touchmove",tm);card.removeEventListener("touchend",te);card.removeEventListener("touchcancel",te)};
    const tm=ev=>{const p=ev.touches[0];lx=p.clientX;ly=p.clientY;if(!started){if(Math.hypot(lx-sx,ly-sy)>8){clearTimeout(timer);off()}return}ev.preventDefault();moveDrag(lx,ly)};
    const te=ev=>{clearTimeout(timer);off();if(started){ev.preventDefault();endDrag(lx,ly)}};
    card.addEventListener("touchmove",tm,{passive:false});card.addEventListener("touchend",te);card.addEventListener("touchcancel",te);
  },{passive:true});
  card.addEventListener("contextmenu",e=>e.preventDefault());
}

// ================= Render =================
function render(full=true){
  renderNav();
  const k=document.querySelector(".kanban"),sl=k?k.scrollLeft:0;
  const m=$("#main");
  m.innerHTML={geral:viewGeral,leads:viewLeads,agenda:viewAgenda,consig:viewConsig,metas:viewMetas}[view]();
  m.querySelectorAll("[data-novo]").forEach(b=>b.onclick=openNovo);
  m.querySelectorAll("[data-lead]").forEach(el=>{
    el.addEventListener("click",()=>{if(!suppressClick)openLead(+el.dataset.lead)});
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openLead(+el.dataset.lead)}});
  });
  m.querySelectorAll("[data-card]").forEach(bindDrag);
  m.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{leadMode=b.dataset.mode;render(false)});
  m.querySelectorAll("[data-per]").forEach(b=>b.onclick=()=>{periodo=b.dataset.per;render(false)});
  const ins=insights();m.querySelectorAll("[data-ins]").forEach(b=>b.onclick=()=>ins[+b.dataset.ins].fn());
  m.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{aiQ=+b.dataset.q;m.querySelectorAll("[data-q]").forEach(x=>x.setAttribute("aria-pressed",x===b));typeAnswer(PERGUNTAS[aiQ].a())});
  const lp=$("#limpa");if(lp)lp.onclick=()=>{soParados=false;render(false)};
  const bi=$("#busca");if(bi)bi.oninput=e=>{busca=e.target.value;const pos=e.target.selectionStart;render(false);const n=$("#busca");n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}};
  const k2=document.querySelector(".kanban");if(k2)k2.scrollLeft=sl;
  if(full)window.scrollTo(0,0);
}
$("#sair").onclick=$("#sair-m").onclick=showLogin;
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS.some(v=>v.id===h)&&h!==view){view=h;render()}});
applyBrand();render();
